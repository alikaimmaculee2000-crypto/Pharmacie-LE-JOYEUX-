name: Deploy React site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package.json
      - name: Install dependencies
        working-directory: front
        run: npm install
      - name: Build
        working-directory: front
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
